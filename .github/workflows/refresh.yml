name: Refresh model data
on:
  schedule:
    - cron: "23 * * * *"        # hourly at :23 (off the top of the hour)
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Publish even if a dataset lost >20% of its rows (upstream really did prune)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not a moving tag. This job holds contents:write
      # on the branch GitHub Pages publishes, so "whatever v4 points at today"
      # is a write-access dependency on someone else's tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
      # Hash-pinned install. requirements.txt is range-pinned by design (it is
      # the human-edited file); requirements.lock is what CI resolves, with a
      # sha256 for every artifact, so a compromised or yanked-and-replaced
      # release cannot enter the build that publishes the site.
      # Regenerate after editing requirements.txt:
      #   .venv/bin/python -m piptools compile --generate-hashes --strip-extras \
      #       --allow-unsafe --output-file=requirements.lock requirements.txt
      - run: pip install --require-hashes -r requirements.lock
      # A failing scraper keeps its cache so one bad upstream response can't wipe
      # a dataset — but the run must NOT stay green. It used to swallow failures
      # with `|| echo ::warning::`, which is how the image scrape 400'd for 29
      # days (2026-07-11 onward) while every run reported success and quietly
      # republished stale ELOs. Failures are recorded here and re-raised at the
      # end, after whatever did succeed has been published.
      - name: Scrape AA (cache kept on failure; failures re-raised at the end)
        id: scrape
        run: |
          failed=""
          python -m data.scraper       || failed="$failed hosted"
          python -m data.local_scraper || failed="$failed local"
          # Incremental: only resolves catalogue rows it has not seen, so the
          # steady-state cost is a handful of HuggingFace requests. A failure
          # here is not a data outage — every unresolved model falls back to the
          # fitted estimator and the hover says so.
          python -m data.arch_scraper  || failed="$failed arch"
          python -m data.image_scraper || failed="$failed image"
          python -m data.video_scraper || failed="$failed video"
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then
            echo "::error title=Scrape failed::no fresh data for:$failed (served cache instead)"
          fi
      - name: Change guard — stop if no data moved
        id: guard
        run: |
          # scrape_status.json is EXCLUDED: it records a checked_at timestamp on
          # every run, so including it would make the guard fire every hour even
          # when no dataset moved — turning a guard that exists to prevent
          # pointless commits into one that guarantees them. The status file is
          # still committed alongside real changes (git add -- data/raw below).
          if git diff --quiet -- data/raw/ ':(exclude)data/raw/scrape_status.json' \
             && [ -z "$(git ls-files --others --exclude-standard -- data/raw/ | grep -v scrape_status.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data change — skipping rebuild and commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # A run that verified the data but found nothing moved still has something
      # to publish: the fact that it checked. record() stamps fetched_at on
      # every successful scrape, but the guard above only fires when a NUMBER
      # moves, so that stamp used to be written on the runner and thrown away —
      # and the site went on serving the stamp from the last run where some
      # price happened to change. The browser ages that stamp live, so a quiet
      # upstream turned the badge orange with "Updated 11 hours ago" while all
      # four scrapers were healthy, and no refresh could clear it because the
      # published manifest really did hold that stamp (2026-08-30: data last
      # moved 06:46, healthy runs at 12:58 and 17:34 published nothing).
      #
      # Asking "is the PUBLISHED stamp old" rather than "did anything change"
      # keeps this guard doing its job: the bot still skips the commit on runs
      # that have nothing to say. The decision lives in Python, with tests.
      - name: Freshness heartbeat — publish that we checked
        id: heartbeat
        run: |
          due=$(python -m data.scrape_status --heartbeat-due docs/figures/manifest.json)
          echo "due=$due" >> "$GITHUB_OUTPUT"
          [ "$due" = "true" ] && echo "Republishing freshness (no data moved)." || true
      # Absolute floor + relative drop. The old check was the floor alone, which
      # a 53% contraction (329 -> 155 rows on 2026-07-24) sailed straight past.
      - name: Sanity check — absolute floor and row-loss guard
        if: steps.guard.outputs.changed == 'true'
        run: python data_guard.py ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
      - name: Rebuild static site (data-only)
        if: steps.guard.outputs.changed == 'true' || steps.heartbeat.outputs.due == 'true'
        run: python build_static.py --data-only
      - name: Commit + push
        if: steps.guard.outputs.changed == 'true' || steps.heartbeat.outputs.due == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/raw docs
          if [ "${{ steps.guard.outputs.changed }}" = "true" ]; then
            msg="data: hourly AA refresh ($(date -u +%Y-%m-%dT%H:%MZ))"
          else
            # Distinct subject so `git log` still reads as a history of the data
            # rather than a heartbeat trace.
            msg="chore: freshness heartbeat ($(date -u +%Y-%m-%dT%H:%MZ))"
          fi
          # The heartbeat path stages a rebuilt manifest whose only change is a
          # timestamp, which is the point. But `git commit` on an empty index
          # exits non-zero under `bash -e`, and a publishing path must never be
          # the thing that turns the run red.
          if git diff --cached --quiet; then
            echo "nothing staged — skipping commit"
          else
            git commit -m "$msg"
            git pull --rebase --autostash origin main
            git push
          fi

      # Last, so a broken scraper never blocks publishing the datasets that did
      # refresh — but the run still goes red instead of hiding a dead endpoint.
      - name: Report scrape failures
        if: steps.scrape.outputs.failed != ''
        run: |
          echo "::error title=Stale datasets published::${{ steps.scrape.outputs.failed }} served from cache — the upstream endpoint is failing."
          exit 1
