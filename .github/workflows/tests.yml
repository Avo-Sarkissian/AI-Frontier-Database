name: Tests

# WHY THIS EXISTS
# ---------------
# Until 2026-09-08 this repository had exactly one workflow — refresh.yml — and
# it does not run pytest. It runs data_guard.py, which checks row counts and
# shrink, so the 437-test suite ran only on a laptop and CI could not see a
# broken invariant at all.
#
# That is not hypothetical. Two tests sat red on main and nobody knew:
#   * an AA refresh priced Grok 4.6 above the Fast tier's cap, so a test that
#     named SpaceXAI by hand died on KeyError '_score'
#   * AA published gpt-oss-20b scoring HIGHER at low effort than at high, which
#     broke a test asserting quality is monotonic in effort
# Both arrived with *data*, not code, so the bot's data commits must be tested.
#
# `on: push` alone does NOT do that, whatever this comment used to claim. The
# bot pushes with the default GITHUB_TOKEN, and GitHub never starts workflows
# from a GITHUB_TOKEN push. From 2026-09-22 not one of ~25 bot commits got a
# Tests run, while a test that named Claude Opus 5 went red the hour AA
# flagged that model deprecated — surfacing only on the next human push,
# blamed on an unrelated commit.
#
# workflow_run is the documented exception: it fires when "Refresh model data"
# finishes, whatever its conclusion (a red refresh still publishes the datasets
# that did scrape). It runs against the tip of main, so the bot's commit is
# what gets tested. It reports; it does not gate the publish — refusing a data
# refresh over a colour-palette test would take the site stale for a cosmetic.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Refresh model data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Read-only. refresh.yml needs contents:write because it publishes; this job
# only ever reports, and a test runner that cannot write cannot rewrite the
# branch GitHub Pages serves.
permissions:
  contents: read

# The bot can push several data commits while a run is in flight. Only the tip
# matters, so supersede rather than queue — but never cancel a PR mid-review.
#
# A no-op refresh (head_sha == sha: nothing was pushed) gets a group of its own.
# Concurrency is applied when a run is QUEUED, before the job `if` below is
# evaluated, so in the shared group a refresh that published nothing cancelled
# the in-flight run for a human push to the same commit and then skipped
# itself — leaving that commit with no test result. The same condition as the
# job `if` must stay in both places.
concurrency:
  group: tests-${{ github.ref }}${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha == github.sha) && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'workflow_run' }}

jobs:
  pytest:
    # A refresh that found nothing to publish leaves main where it started
    # (its head_sha), and that commit has already been tested. Only a refresh
    # that pushed moves the tip.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.head_sha != github.sha
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned, matching refresh.yml: a moving tag is a dependency on
      # whatever someone else points it at today.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      # Both locks are hash-pinned. requirements.lock is the runtime set the
      # publishing job installs; requirements-dev.lock adds pytest and nothing
      # else, and is kept separate so a test runner never enters the set that
      # gets vendored into pycode.zip.
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: pytest
        run: python -m pytest -q
