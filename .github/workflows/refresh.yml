name: Refresh model data
on:
  schedule:
    - cron: "23 * * * *"        # hourly at :23 (off the top of the hour)
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Publish even if a dataset lost >20% of its rows (upstream really did prune)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install "plotly==6.5.2"
      # A failing scraper keeps its cache so one bad upstream response can't wipe
      # a dataset — but the run must NOT stay green. It used to swallow failures
      # with `|| echo ::warning::`, which is how the image scrape 400'd for 29
      # days (2026-07-11 onward) while every run reported success and quietly
      # republished stale ELOs. Failures are recorded here and re-raised at the
      # end, after whatever did succeed has been published.
      - name: Scrape AA (cache kept on failure; failures re-raised at the end)
        id: scrape
        run: |
          failed=""
          python -m data.scraper       || failed="$failed hosted"
          python -m data.local_scraper || failed="$failed local"
          python -m data.image_scraper || failed="$failed image"
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then
            echo "::error title=Scrape failed::no fresh data for:$failed (served cache instead)"
          fi
      - name: Change guard — stop if no data moved
        id: guard
        run: |
          # scrape_status.json is EXCLUDED: it records a checked_at timestamp on
          # every run, so including it would make the guard fire every hour even
          # when no dataset moved — turning a guard that exists to prevent
          # pointless commits into one that guarantees them. The status file is
          # still committed alongside real changes (git add -- data/raw below).
          if git diff --quiet -- data/raw/ ':(exclude)data/raw/scrape_status.json' \
             && [ -z "$(git ls-files --others --exclude-standard -- data/raw/ | grep -v scrape_status.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data change — skipping rebuild and commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Absolute floor + relative drop. The old check was the floor alone, which
      # a 53% contraction (329 -> 155 rows on 2026-07-24) sailed straight past.
      - name: Sanity check — absolute floor and row-loss guard
        if: steps.guard.outputs.changed == 'true'
        run: python data_guard.py ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
      - name: Rebuild static site (data-only)
        if: steps.guard.outputs.changed == 'true'
        run: python build_static.py --data-only
      - name: Commit + push
        if: steps.guard.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/raw docs
          git commit -m "data: hourly AA refresh ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase --autostash origin main
          git push

      # Last, so a broken scraper never blocks publishing the datasets that did
      # refresh — but the run still goes red instead of hiding a dead endpoint.
      - name: Report scrape failures
        if: steps.scrape.outputs.failed != ''
        run: |
          echo "::error title=Stale datasets published::${{ steps.scrape.outputs.failed }} served from cache — the upstream endpoint is failing."
          exit 1
